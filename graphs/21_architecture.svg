<text x="167.0" y="374" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12.5" fill="#5a6070">+ MelValueNet critic</text>
<text x="167.0" y="391" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12.5" fill="#5a6070">5-frame receptive field</text>
<path d="M 282 382 L 556 382" fill="none" stroke="#2a9d8f" stroke-width="2.0" marker-end="url(#head)"/>
<rect x="52" y="470" width="230" height="96" rx="9" fill="#ffffff" stroke="#2a9d8f" stroke-width="1.6"/>
