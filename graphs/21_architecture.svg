<path d="M 880 466 L 880 440" fill="none" stroke="#b9881f" stroke-width="2.0" marker-end="url(#head)"/>
<rect x="1072" y="128" width="360" height="150" rx="9" fill="#ffffff" stroke="#c2413b" stroke-width="1.6"/>
<text x="1252.0" y="151" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#1b1f27">detectors.py   four countermeasures</text>
<text x="1252.0" y="172" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12.5" fill="#5a6070">AASIST       AASIST-L</text>
<text x="1252.0" y="189" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12.5" fill="#5a6070">RawNet2      RawGAT-ST (mul)</text>
<text x="1252.0" y="206" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12.5" fill="#5a6070">each returns P(human), 1 = human</text>
<text x="1252.0" y="223" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12.5" fill="#5a6070">soft-min over the four is the objective</text>
<rect x="1072" y="296" width="360" height="76" rx="9" fill="#fdf1ec" stroke="#c2413b" stroke-width="1.6"/>
<text x="1252.0" y="319" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#1b1f27">cross-environment bridge</text>
<text x="1252.0" y="340" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12.5" fill="#5a6070">reward.py shells out to VOICEFAKE_PYTHON</text>
<text x="1252.0" y="357" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12.5" fill="#5a6070">detectors.py --json, whole batch in one call</text>
