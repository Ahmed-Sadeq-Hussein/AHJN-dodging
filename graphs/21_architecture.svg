<text x="167.0" y="514" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12.5" fill="#5a6070">train_ppo_mel.py</text>
<text x="167.0" y="531" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12.5" fill="#5a6070">clipped surrogate, dual ascent</text>
