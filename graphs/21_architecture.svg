<text x="663.0" y="514" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12.5" fill="#5a6070">collect_pgd.py, diffscore.py</text>
<text x="663.0" y="531" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12.5" fill="#5a6070">per-clip, expensive, strong</text>
<rect x="796" y="470" width="204" height="96" rx="9" fill="#ffffff" stroke="#b9881f" stroke-width="1.6"/>
<text x="898.0" y="493" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#1b1f27">distilled student</text>
<text x="898.0" y="514" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12.5" fill="#5a6070">distill.py</text>
<text x="898.0" y="531" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12.5" fill="#5a6070">one pass, imitates PGD</text>
