<text x="202.0" y="891" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#1b1f27">ahjn.py   the command line</text>
<text x="202.0" y="912" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12.5" fill="#5a6070">check / detect / score / rate</text>
<text x="202.0" y="929" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12.5" fill="#5a6070">train / status / speak / figures / verify</text>
<rect x="372" y="868" width="250" height="92" rx="9" fill="#f2f3f5" stroke="#8a8f98" stroke-width="1.6"/>
<text x="497.0" y="891" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#1b1f27">scorecard.py</text>
<text x="497.0" y="912" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12.5" fill="#5a6070">every metric for a clip,</text>
<text x="497.0" y="929" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12.5" fill="#5a6070">one call, never raises</text>
<rect x="642" y="868" width="270" height="92" rx="9" fill="#f2f3f5" stroke="#8a8f98" stroke-width="1.6"/>
<text x="777.0" y="891" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#1b1f27">listening test</text>
<text x="777.0" y="912" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12.5" fill="#5a6070">rl/mos_corpus.py + the rating page</text>
