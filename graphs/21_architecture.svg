<text x="1047.0" y="912" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12.5" fill="#5a6070">plot_*.py -&gt; graphs/</text>
<text x="1047.0" y="929" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12.5" fill="#5a6070">21 of them</text>
