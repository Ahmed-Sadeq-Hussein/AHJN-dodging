<text x="40" y="46" font-size="25" font-weight="700" fill="#1b1f27">AHJN architecture: where the edit happens and what judges it</text>
<text x="40" y="70" font-size="14" fill="#5a6070">A clone is made, one tensor inside it is edited, and four detectors plus three quality measures decide whether that was worth it.</text>
