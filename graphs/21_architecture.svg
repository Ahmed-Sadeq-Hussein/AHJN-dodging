<text x="740.0" y="353" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#1b1f27">mel_edit_hook   (mel_policy.py)</text>
<text x="740.0" y="374" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12.5" fill="#5a6070">patches model.hift.inference for a with-block</text>
