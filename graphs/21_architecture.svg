<text x="1307.0" y="929" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12.5" fill="#5a6070">rl/ANALYSIS.md, MATH.md</text>
<text x="40" y="1004" font-size="12" fill="#5a6070">Solid arrows carry audio or tensors. Dashed arrows carry scores. The yellow path is the white-box attack, which has gradients; the green path is reinforcement learning, which has only a scalar.</text>
