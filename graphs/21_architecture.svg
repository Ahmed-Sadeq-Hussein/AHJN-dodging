<text x="465.0" y="659" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#1b1f27">constraints   (Tester.py)</text>
<text x="465.0" y="680" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12.5" fill="#5a6070">CAM++ 192-d embedding, cosine &gt;= 0.70</text>
<text x="465.0" y="697" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12.5" fill="#5a6070">Whisper 'base' + jiwer, WER &lt;= 0.10</text>
<text x="465.0" y="714" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12.5" fill="#5a6070">the same embedding CosyVoice2 conditions on</text>
<rect x="660" y="636" width="340" height="104" rx="9" fill="#ffffff" stroke="#9aa1ad" stroke-width="1.6"/>
<text x="830.0" y="659" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#1b1f27">audio quality   (quality.py)</text>
<text x="830.0" y="680" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12.5" fill="#5a6070">TorchAudio-SQUIM, reference-free</text>
<text x="830.0" y="697" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12.5" fill="#5a6070">PESQ, STOI, SI-SDR, estimated MOS</text>
<text x="830.0" y="714" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12.5" fill="#5a6070">reports the cost; never optimised against</text>
<rect x="52" y="636" width="220" height="104" rx="9" fill="#e8f5f2" stroke="#2a9d8f" stroke-width="1.6"/>
<text x="162.0" y="659" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#1b1f27">reward.py</text>
<text x="162.0" y="680" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12.5" fill="#5a6070">soft-min  +  two</text>
<text x="162.0" y="697" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12.5" fill="#5a6070">Lagrange multipliers,</text>
<text x="162.0" y="714" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12.5" fill="#5a6070">hard floor on collapse</text>
