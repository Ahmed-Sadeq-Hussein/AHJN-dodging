<path d="M 52 688 L 30 688 L 30 518 L 48 518" fill="none" stroke="#2a9d8f" stroke-width="2.0" marker-end="url(#head)" stroke-linejoin="round"/>
<text x="40.0" y="597.0" text-anchor="start" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#2a9d8f">reward</text>
<text x="340" y="614" font-size="12" fill="#b9881f">diffscore.py backpropagates through HiFT and the detectors, so the teacher never uses the reward at all</text>
